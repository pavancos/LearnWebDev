<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Range</title>
</head>
<body>
    <input type="text">
    <h1></h1>    
    <script>
        let input = document.querySelector('input');
        let h1 = document.querySelector('h1');
        input.addEventListener('change',()=>{
            let val=Number(input.value);
            if(isNaN(val)){
                h1.textContent='Not a Numner';
                input.focus();
            }else if(val<0 || val>999){
                h1.textContent='Out of Range';
                input.focus();
            }else{
                h1.textContent=val;
            }
        })
    </script>
</body>
</html>
