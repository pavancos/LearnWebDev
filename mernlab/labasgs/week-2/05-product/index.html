<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Product</title>
</head>
<body>
    <button>Find Product</button>
    <h1></h1>

    <script>
        const btn=document.querySelector('button');
        const h1=document.querySelector('h1');
        btn.addEventListener('click',()=>{
            let mulA=prompt('Enter A:');
            let mulb=prompt('Enter B:');
            let mul=mulA*mulb;
            h1.textContent=`The product of ${mulA} and ${mulb} is ${mul}`;
            alert("Product is "+mul);
        })
    </script>
</body>
</html>
